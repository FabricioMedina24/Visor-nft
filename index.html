<!DOCTYPE html>

    <title>Visor NFT 3D Premium</title>
    
    <link rel="stylesheet" href="./style.css">

    <style>body{background-color:#0b0b0b;margin:0;overflow:hidden}#loader-container{z-index:99999;background-color:#0b0b0b;justify-content:center;align-items:center;width:100vw;height:100vh;transition:opacity .5s;display:flex;position:fixed;top:0;left:0}.loader-box{flex-direction:column;align-items:center;width:300px;display:flex}.golden-track{background:#ffd7001a;border-radius:2px;width:100%;height:2px;position:relative;overflow:hidden}.golden-bar{background:gold;width:0%;height:100%;animation:12s cubic-bezier(.1,.8,.2,1) forwards completarBarra;position:absolute;left:0;box-shadow:0 0 10px gold,0 0 20px #fa0}@keyframes completarBarra{0%{width:0%}30%{width:50%}60%{width:80%}to{width:98%}}#loading-text-lore{color:gold;letter-spacing:1px;text-shadow:0 0 8px #ffd70099;text-align:center;margin-top:15px;font-family:Times New Roman,Times,serif;font-size:13px;font-style:italic}</style>
